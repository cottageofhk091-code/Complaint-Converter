<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メールアドレスの確認</title>
  </head>
  <body style="margin:0;padding:0;background:#0f172a;font-family:'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif;color:#e2e8f0;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0f172a;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:560px;background:#1e293b;border-radius:12px;padding:32px 28px;border:1px solid #334155;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.08em;color:#60a5fa;text-transform:uppercase;">
                  Smartお詫びコンシェルジュ
                </p>
                <h1 style="margin:0 0 20px;font-size:20px;line-height:1.4;color:#f8fafc;">
                  メールアドレスの確認
                </h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#cbd5e1;">
                  Smartお詫びコンシェルジュへのご登録ありがとうございます。
                </p>
                <p style="margin:0 0 28px;font-size:15px;line-height:1.7;color:#cbd5e1;">
                  以下のリンクをクリックして登録を完了してください。
                </p>
                <p style="margin:0 0 28px;">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:8px;"
                  >
                    メールアドレスを確認する
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:12px;line-height:1.6;color:#94a3b8;">
                  ボタンが開けない場合は、次の URL をブラウザに貼り付けてください。
                </p>
                <p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;color:#64748b;">
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0;font-size:11px;color:#64748b;">
            このメールに心当たりがない場合は破棄してください。
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
