# Supabase Auth メールテンプレート（日本語）
#
# 本番（Hosted Supabase）では Dashboard の Email Templates に反映してください。
# このファイル群はアプリ側の正本（コピペ用）です。
#
# Dashboard:
#   Authentication → Email Templates → Confirm signup
#
# 件名:
#   【Smartお詫びコンシェルジュ】メールアドレスの確認
#
# 本文（プレーンテキスト例）:
#   Smartお詫びコンシェルジュへのご登録ありがとうございます。
#   以下のリンクをクリックして登録を完了してください。
#
#   {{ .ConfirmationURL }}
#
# HTML 本文:
#   supabase/templates/confirm-signup.html をコピー
#
# パスワード再設定（Recover）も同様に {{ .ConfirmationURL }} を使用します。

[project]
id = "smart-owabi-concierge"

[api]
enabled = true

[db]
port = 54322

[studio]
enabled = true

[auth]
enabled = true
# Site URL は環境に合わせて変更（本番ドメイン）
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/update-password"
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "【Smartお詫びコンシェルジュ】メールアドレスの確認"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "【Smartお詫びコンシェルジュ】パスワード再設定"
content_path = "./supabase/templates/confirm-signup.html"
