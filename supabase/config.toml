# Supabase Auth メールテンプレート（日本語）
#
# 本番（Hosted Supabase）では Dashboard の Email Templates に反映してください。
# このファイル群はアプリ側の正本（コピペ用）です。
#
# Confirm signup:
#   件名: 【Smartお詫びコンシェルジュ】メールアドレスの確認
#   HTML: supabase/templates/confirm-signup.html
#
# Reset password (recovery):
#   件名: 【Smartお詫びコンシェルジュ】パスワードの再設定
#   HTML: supabase/templates/reset-password.html
#
# リンクは Token Hash 方式（PKCE 不要）を使用します。

[project]
id = "smart-owabi-concierge"

[api]
enabled = true

[db]
port = 54322

[studio]
enabled = true

[auth]
enabled = true
# Site URL は環境に合わせて変更（本番ドメイン）
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?type=recovery",
  "http://localhost:3000/auth/callback?type=recovery&next=/auth/update-password",
  "http://localhost:3000/auth/update-password"
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "【Smartお詫びコンシェルジュ】メールアドレスの確認"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "【Smartお詫びコンシェルジュ】パスワードの再設定"
content_path = "./supabase/templates/reset-password.html"
